<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>女装直播间视觉生成系统</title>
  <style>
    :root{
      --bg:#f1f2ee;--panel:#fbfaf6;--panel2:#e7ece8;--ink:#202624;--muted:#66706c;
      --line:#cfd7d2;--accent:#3f766d;--accent2:#9b6658;--gold:#b89455;--dark:#25302d;
      --shadow:0 18px 50px rgba(29,41,37,.10);
      font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);background:linear-gradient(120deg,rgba(63,118,109,.12),transparent 34%),linear-gradient(300deg,rgba(184,148,85,.14),transparent 38%),linear-gradient(180deg,#f7f6f0,var(--bg));min-height:100vh}
    button,input,select,textarea{font:inherit}
    .app{width:min(1540px,calc(100% - 32px));margin:0 auto;padding:24px 0 30px}
    .topbar{display:grid;grid-template-columns:minmax(280px,1fr) auto;gap:16px;align-items:end;margin-bottom:16px}
    h1{margin:0;font-size:clamp(28px,4vw,52px);line-height:1.06;letter-spacing:0;font-weight:820}
    .subtitle{margin:10px 0 0;max-width:960px;color:var(--muted);line-height:1.75;font-size:15px}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:38px;padding:9px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .16s ease,border-color .16s ease,background .16s ease}
    .btn:hover{transform:translateY(-1px);border-color:#9aaba5}
    .btn.primary{background:var(--dark);color:#fbfaf6;border-color:var(--dark)}
    .btn.mini{min-height:30px;padding:5px 9px;font-size:12px}
    .btn svg{width:17px;height:17px;stroke-width:2}
    .layout{display:grid;grid-template-columns:minmax(400px,590px) minmax(0,1fr);gap:16px;align-items:start}
    .panel{background:rgba(251,250,246,.92);border:1px solid rgba(207,215,210,.95);border-radius:8px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
    .form-panel{position:sticky;top:16px;overflow:hidden;max-height:calc(100vh - 32px);overflow-y:auto}
    .visual{display:grid;grid-template-columns:126px 1fr;gap:14px;padding:16px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(231,236,232,.92),rgba(251,250,246,.62))}
    .room-mark{min-height:154px;border-radius:6px;overflow:hidden;border:1px solid #bbc9c4;position:relative;background:linear-gradient(90deg,transparent 0 18%,rgba(255,255,255,.45) 18% 20%,transparent 20% 80%,rgba(255,255,255,.42) 80% 82%,transparent 82%),linear-gradient(180deg,#e8e4dc 0 40%,#cfd9d5 40% 41%,#f5f2ea 41% 100%)}
    .room-mark::before{content:"";position:absolute;width:48px;height:98px;left:39px;top:31px;border-radius:18px 18px 7px 7px;background:linear-gradient(180deg,#262827,#4b4b45);box-shadow:0 0 0 7px rgba(184,148,85,.16)}
    .room-mark::after{content:"";position:absolute;left:13px;right:13px;bottom:15px;height:16px;border-radius:999px;background:rgba(63,118,109,.18);box-shadow:0 -42px 0 -4px rgba(255,255,255,.45),0 -86px 0 -6px rgba(37,48,45,.12)}
    .visual h2{margin:0 0 9px;font-size:18px;letter-spacing:0}
    .visual p{margin:0;color:var(--muted);font-size:13px;line-height:1.75}
    .status-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .status{border:1px solid #c7d0cd;border-radius:6px;padding:8px;background:rgba(255,255,255,.48);min-height:50px}
    .status b{display:block;font-size:17px;color:var(--accent)}
    .status span{color:var(--muted);font-size:12px}
    form{padding:14px;display:grid;gap:14px}
    details{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.36);overflow:hidden}
    details[open]{background:rgba(255,255,255,.58)}
    summary{padding:12px 13px;cursor:pointer;font-weight:780;color:#2a3432;list-style:none;display:flex;align-items:center;justify-content:space-between}
    summary::-webkit-details-marker{display:none}
    summary::after{content:"+";color:var(--accent);font-weight:800;font-size:18px}
    details[open] summary::after{content:"-"}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 13px 13px}
    .field.full{grid-column:1 / -1}
    label{display:block;font-size:12px;color:#4b5653;margin-bottom:6px;font-weight:760}
    input,select,textarea{width:100%;border:1px solid #c7d0cd;border-radius:7px;background:rgba(255,255,255,.82);color:var(--ink);outline:none;padding:10px 11px;min-height:40px;transition:border-color .16s ease,box-shadow .16s ease}
    textarea{min-height:74px;resize:vertical;line-height:1.65}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,118,109,.14)}
    .custom{margin-top:7px}
    .hint{color:var(--muted);font-size:12px;line-height:1.55;margin-top:6px}
    .checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .chip{display:inline-flex;align-items:center;gap:7px;min-height:34px;border:1px solid #c7d0cd;border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.56);color:#394441;font-size:12px;cursor:pointer;user-select:none}
    .chip input{width:14px;height:14px;min-height:0;accent-color:var(--accent);padding:0}
    .output-panel{padding:16px;display:grid;gap:14px}
    .output-header{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
    .output-header h2{margin:0;font-size:20px;letter-spacing:0}
    .sections{display:grid;gap:12px}
    .output-section{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.62);overflow:hidden}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);background:rgba(231,236,232,.68)}
    .section-title h3{margin:0;font-size:15px;letter-spacing:0}
    .section-title span{color:var(--muted);font-size:12px}
    .title-actions{display:flex;gap:8px;align-items:center}
    .content{padding:13px;line-height:1.82;color:#26302e;white-space:pre-wrap;word-break:break-word;font-size:14px}
    .prompt{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;background:#f4f3ec;color:#202624}
    .review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .review-item{border:1px solid #d4d9d7;border-radius:7px;padding:8px 9px;background:rgba(255,255,255,.6);min-height:62px}
    .review-item strong{display:block;color:#36413f;font-size:12px;margin-bottom:5px}
    .badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;font-size:11px;font-weight:760;margin-right:5px;border:1px solid transparent}
    .badge.locked{color:#3d655d;border-color:rgba(75,116,103,.32);background:rgba(75,116,103,.12)}
    .badge.auto{color:#7b5d50;border-color:rgba(155,102,88,.34);background:rgba(155,102,88,.12)}
    .copy-buffer{width:100%;min-height:160px;border:1px solid var(--accent);border-radius:8px;background:#fff;color:#202624;padding:12px;line-height:1.65;resize:vertical;display:none}
    .toast{position:fixed;right:18px;bottom:18px;background:var(--dark);color:#fbfaf6;border-radius:8px;padding:10px 13px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .18s ease,transform .18s ease;max-width:min(360px,calc(100% - 36px));z-index:10}
    .toast.show{opacity:1;transform:translateY(0)}
    @media (max-width:1080px){.layout,.topbar{grid-template-columns:1fr}.toolbar{justify-content:flex-start}.form-panel{position:static;max-height:none}}
    @media (max-width:640px){.app{width:min(100% - 20px,1540px);padding-top:14px}.fields,.review-grid,.visual,.checks{grid-template-columns:1fr}.room-mark{min-height:170px}.output-header{grid-template-columns:1fr}.toolbar{width:100%}.btn{flex:1;justify-content:center}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>女装直播间视觉生成系统</h1>
        <p class="subtitle">通过表单参数生成稳定、可复用、可直接用于 AI 图片生成的女装直播间提示词，重点控制衣服展示、空间搭建和透视关系。</p>
      </div>
      <div class="toolbar">
        <button class="btn" type="button" id="sampleBtn" title="填入 Demo 参数"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v18M3 12h18"/></svg>Demo</button>
        <button class="btn" type="button" id="resetBtn" title="重置默认值"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></svg>重置</button>
        <button class="btn primary" type="button" id="generateBtn" title="生成提示词"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l2.2 6.8H21l-5.5 4 2.1 6.8-5.6-4.1-5.6 4.1 2.1-6.8L3 8.8h6.8z"/></svg>生成</button>
      </div>
    </header>

    <section class="layout">
      <aside class="panel form-panel">
        <div class="visual">
          <div class="room-mark" aria-hidden="true"></div>
          <div>
            <h2>字段结构 V2</h2>
            <p>模块：输出目标、销售、直播、服装、场景、空间复用、稳定出图、负面限制。</p>
            <div class="status-strip">
              <div class="status"><b id="lockedCount">0</b><span>locked</span></div>
              <div class="status"><b id="autoCount">0</b><span>auto/empty</span></div>
              <div class="status"><b id="fillCount">0</b><span>补全项</span></div>
            </div>
          </div>
        </div>
        <form id="promptForm"></form>
      </aside>

      <section class="panel output-panel">
        <div class="output-header">
          <div>
            <h2>生成结果</h2>
            <p class="subtitle">六个结果卡片：空间方向判断、推荐空间母版、可复用空间元素、镜头与透视要求、完整生成提示词、负面限制词。</p>
          </div>
          <button class="btn primary" type="button" id="copyBtn" title="复制完整结果"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制全部</button>
        </div>
        <div class="sections" id="outputSections"></div>
      </section>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const moduleTitles = {
      output:'输出目标层', sales:'直播销售层', live:'直播类型层', clothing:'服装商品层',
      scene:'场景包装层', reusableSpace:'空间复用元素库',
      camera:'稳定出图层', negative:'负面限制层'
    };
    const demo = {
      outputMode:'主播讲解试穿图', layoutMode:'单张竖版直播间图', includePerson:'有主播/模特', commercialUse:'女装直播间主视觉',
      salesType:'店播实卖直播', activityNode:'秋冬上新', benefitInfo:['7天无理由','30天保价'], functionSellingPoints:['保暖','轻量','高蓬松度'],
      liveRoomType:'站播试穿直播间', framingRange:'七分身讲解', tryOnMode:'正面讲解', hostRole:'品牌主播', hostAction:'轻扶衣服细节',
      season:'冬季', fashionStyle:'质感通勤', clothingCategory:'羽绒服', clothingColor:'米白', material:'鹅绒填充', silhouette:'适度蓬松', layering:'外套 + 下装 + 鞋履完整造型', stylingItems:['围巾','靴子'], displayFocus:['上身效果','功能卖点'],
      liveRoomSpaceType:'真实居家直播间', sceneStyle:'大空间转角居家感直播间 large-corner-home-live-room', sceneLayoutVariant:'side_window_corner', materialPalette:'warm_wood_cream', sceneStyleDirection:'木质暖调风', spaceMode:'真实可搭建空间', themePackaging:'秋冬橱窗主题', backgroundStructure:'转角墙面', softProps:['窗帘','沙发','落地灯','绿植'], sideDisplay:'无', designIntensity:'低：接近真实直播间', realismLevel:'强写实，低 AI 味',
      spaceTemplate:'暖调家居冬装直播间', wallElements:['暖米大白墙','深木饰面背景墙'], lightingElements:['隐藏灯带','顶部暖光洗墙'], furnitureElements:['沙发','边桌'], artElements:['挂画'], plantElements:['盆栽绿植'], fabricElements:['窗帘','地毯'],
      aspectRatio:'9:16', focalLength:'全画幅 35mm', cameraLevel:'严格水平机位', cameraHeight:'1.25m–1.35m 站播平视机位', perspectiveMode:'轻转角室内透视', verticalRule:'所有墙面、窗框、背景板、柜体、屏幕边缘、门框、窗帘边缘保持垂直', spatialAxisRule:'地面、背景墙、家具、灯具、软装和人物脚下落点服从同一个室内空间轴线'
    };
    const initialLocked = {
      aspectRatio:'9:16',
      focalLength:'全画幅 35mm',
      cameraLevel:'严格水平机位',
      verticalRule:'所有墙面、窗框、背景板、柜体、屏幕边缘、门框、窗帘边缘保持垂直',
      spatialAxisRule:'地面、背景墙、家具、灯具、软装和人物脚下落点服从同一个室内空间轴线'
    };
    const fields = {
      outputMode:f('outputMode','输出模式','output',['主播讲解试穿图','半身细节讲解图','模特 look 展示图','生活方式种草图','空场景底图','场景提案图','场景 moodboard 拼图']),
      layoutMode:f('layoutMode','画面组织方式','output',['单张竖版直播间图','单张空场景图','多格拼贴提案图','左右对比图','带手机壳直播截图图']),
      includePerson:f('includePerson','是否包含人物','output',['有主播/模特','无人物，仅空场景','先生成带人图','先生成空场景底图']),
      commercialUse:f('commercialUse','商业用途','output',['女装直播间主视觉','直播间背景底图','客户提案图','直播间搭建参考图','女装带货演示图','小红书种草封面','抖音直播截图']),
      salesType:f('salesType','直播间销售类型','sales',['品牌官方专场','达人实卖直播','店播实卖直播','反季清仓直播','新品上新直播','高端形象直播','功能型服装讲解直播']),
      activityNode:f('activityNode','活动节点','sales',['无节点','上新日','春夏上新','秋冬上新','618','双11','双12','七夕','中秋','年货节','反季限时购','品牌专场']),
      benefitInfo:mf('benefitInfo','权益信息','sales',['不显示','7天无理由','30天保价','质保90天','顺丰包邮','赠运费险','官方正品','拍1发3','支持试穿']),
      functionSellingPoints:mf('functionSellingPoints','功能卖点','sales',['保暖','防风','防水','轻量','防晒','透气','高蓬松度','科技面料','重磅真丝','垂感','显瘦','舒适']),
      liveRoomType:f('liveRoomType','直播间类型','live',['站播试穿直播间','坐播讲解直播间','半身细节讲解直播间','全身走播直播间','品牌上新直播间','大促活动直播间','轻布景女装直播间','家居感女装直播间','精品店式女装直播间']),
      framingRange:f('framingRange','出镜范围','live',['全身试穿','七分身讲解','半身细节讲解','上半身材质展示','空场景无人物']),
      tryOnMode:f('tryOnMode','试穿展示方式','live',['全身站播试穿','半身近距离讲解','走位展示','正面讲解','侧身展示版型','手指指向细节','轻扶衣服细节','搭配包包展示','手持衣服讲解']),
      hostRole:f('hostRole','主播角色','live',['品牌主播','门店导购','达人主播','试穿模特','品牌主理人感','生活方式博主感']),
      hostAction:f('hostAction','主播动作','live',['正面站立讲解','自然走位','轻扶衣领','指向面料细节','手持主推服装','拿包搭配展示','挥手互动','双手自然垂落']),
      season:f('season','季节','clothing',['春季','夏季','初秋','深秋','冬季','春夏上新','秋冬上新','反季冬装','年货节冬季']),
      fashionStyle:f('fashionStyle','女装风格','clothing',['都市通勤','韩系温柔','法式轻复古','新中式','轻熟贵气','都市丽人','质感通勤','度假松弛','高级居家','小香风','国风改良','礼服感轻奢','运动户外']),
      clothingCategory:f('clothingCategory','服装品类','clothing',['羽绒服','鹅绒服','冲锋衣','防晒衣','大衣','风衣',{label:'牛仔裤',value:'denim_jeans'},{label:'高腰牛仔裤',value:'high_waist_denim'},{label:'阔腿牛仔裤',value:'wide_leg_denim'},{label:'微喇牛仔裤',value:'micro_flare_denim'},{label:'直筒牛仔裤',value:'straight_denim'},{label:'丹宁裤',value:'denim_pants'},'连衣裙','半裙','裤装','上衣','针织衫','衬衫','马甲','小香风外套','内衣','套装','吊带']),
      denimFit:f('denimFit','牛仔裤裤型','clothing',['非牛仔裤','直筒牛仔裤','阔腿牛仔裤','微喇牛仔裤','高腰牛仔裤','烟管牛仔裤','工装牛仔裤','黑灰牛仔裤']),
      denimColor:f('denimColor','牛仔颜色','clothing',['非牛仔裤','浅水洗蓝','中蓝','深蓝','黑灰','灰蓝','复古水洗蓝']),
      clothingColor:f('clothingColor','服装颜色','clothing',['黑色','白色','米白','奶油色','驼色','浅灰','深灰','棕色','墨绿','酒红','粉色','浅蓝','紫色']),
      material:f('material','面料材质','clothing',['哑光尼龙','防风科技面料','鹅绒填充','羊毛','呢料','针织','真丝','重磅真丝','蕾丝','雪纺','棉麻','缎面','皮革']),
      silhouette:f('silhouette','版型廓形','clothing',['修身','宽松','适度蓬松','H 型','A 字型','X 型收腰','直筒','包臀','垂顺']),
      layering:f('layering','穿搭层次','clothing',['单品试穿','外套 + 内搭','上衣 + 下装','套装完整搭配','外套 + 下装 + 鞋履完整造型','礼服完整造型']),
      stylingItems:mf('stylingItems','搭配单品','clothing',['包包','靴子','高跟鞋','乐福鞋','运动鞋','帽子','围巾','项链','耳饰','腰带']),
      displayFocus:mf('displayFocus','展示重点','clothing',['整体搭配','上身效果','面料质感','版型显瘦','功能卖点','细节工艺','季节氛围']),
      liveRoomSpaceType:f('liveRoomSpaceType','直播间空间类型','scene',['轻布景女装直播间','真实居家直播间','品牌专场直播间','精品店式直播间','主题包装直播间','户外感室内场景','空场景底图']),
      sceneStyle:f('sceneStyle','房间样式 / Scene Style','scene',['大空间转角居家感直播间 large-corner-home-live-room','女装层次窗景假景直播间 layered-window-scenic-live-room','默认真实服装直播间 default-clean-live-room']),

    function auditPromptForFauxGardenEmptyFront({positivePrompt = '', negativePrompt = ''} = {}){
      const positive = String(positivePrompt || '').toLowerCase();
      const negative = String(negativePrompt || '').toLowerCase();
      const notes = [];
      const hasAll = (text, terms) => terms.every(term => text.includes(term.toLowerCase()));
      const hasAny = (text, terms) => terms.some(term => text.includes(term.toLowerCase()));

      const topStudioLocked =

      const leftOpenStudioSpace =

        positive.includes('20-25% of the image width') &&
        positive.includes('do not enlarge it beyond the locked proportion');
      const rearWallBehindLightbox =

      const coveTransition =

      const grassWidthRule =

      const cottageOverlapRule =
        hasAll(positive, ['wooden cottage window facade must clearly overlap in front of the right side','physically cover the right ending edge of the scenic lightbox']) &&
        hasAll(negative, ['cottage module not overlapping lightbox','blank white wall gap']);
      const noVisibleEquipment =
        hasAll(negative, ['visible light stand','visible softbox','visible LED panel'.toLowerCase(),'visible cables']);
      const sharedSceneDNAIncluded =

      const commonNegativeIncluded =
        hasAll(negative, ['different angle','redesigned layout','changed cottage position','table moved to another side','hydrangea tree moved','inconsistent grass boundary','different scenic set']);
      const sameFrontCameraAxis =
        hasAll(positive, ['same scene as host_final_9x16','same front camera axis','do not redesign the set','same relative positions']);
      const differentCropAllowed =
        positive.includes('different crop distance is allowed; different camera angle is not allowed');
      const emptyShowsStudioShell =

      const chineseDouyinRealismPriority =

      const sceneDNALock =
        sharedSceneDNAIncluded &&
        commonNegativeIncluded &&
        sameFrontCameraAxis &&
        differentCropAllowed;

      const criticalNegativeTerms = [
        'no wall behind lightbox',
        'floating scenic wall',
        'u-shaped cyclorama',
        'narrow grass strip',
        'visible light stand',
        'left open studio area dominating the frame',
        'grass narrowing into a trapezoid strip',
        'giant rounded screen frame',
        'redesigned layout',
        'different scenic set'
      ];
      const missingCriticalNegative = criticalNegativeTerms.filter(term => !negative.includes(term));

      [
        ['topStudioLocked', topStudioLocked],
        ['leftOpenStudioSpace', leftOpenStudioSpace],
        ['rearWallBehindLightbox', rearWallBehindLightbox],

        ['grassWidthRule', grassWidthRule],
        ['cottageOverlapRule', cottageOverlapRule],
        ['noVisibleEquipment', noVisibleEquipment],

        ['commonNegativeIncluded', commonNegativeIncluded],
        ['sameFrontCameraAxis', sameFrontCameraAxis],
        ['differentCropAllowed', differentCropAllowed],
        ['emptyShowsStudioShell', emptyShowsStudioShell],
        ['hostHidesStudioShell', hostHidesStudioShell],
        ['hostTableNotBlockingBody', hostTableNotBlockingBody],
        ['chineseDouyinRealismPriority', chineseDouyinRealismPriority]
      ].forEach(([key, ok]) => { if (!ok) addMissing(key, 'required lock missing'); });
      missingCriticalNegative.forEach(term => addMissing(`negative:${term}`, 'critical negative term missing'));

      const status = notes.length ? 'fail' : 'pass';
      return {

        const values = Array.isArray(value) ? value : String(value).split(/[、,，]/).map(v=>v.trim()).filter(Boolean);
        form.querySelectorAll(`input[name="${key}"]`).forEach(input => input.checked = values.includes(input.value));
        if (!values.length) {

          if (auto) auto.checked = true;

      const el = form.elements[key];
      const hasOption = Array.from(el.options).some(option => option.value === value);

    function auditPromptWritingFramework(promptPack = {}){
      const positivePrompt = String(promptPack.positivePrompt || '');

      const wordCount = (compactPrompt.match(/[A-Za-z0-9]+(?:[-'][A-Za-z0-9]+)?/g) || []).length;

      const findFirst = terms => {
        const indexes = terms
          .map(term => compactLower.indexOf(term.toLowerCase()))
          .filter(index => index >= 0);
        return indexes.length ? Math.min(...indexes) : -1;
      };
      const hasAny = terms => terms.some(term => positiveLower.includes(term.toLowerCase()));
      const conceptCount = pattern => (positiveAll.match(pattern) || []).length;

      const spaceTerms = [

      const hostDisplayTerms = [
        'speaking to the live camera',
        'speaks to the live camera',
        'product explanation gesture',
        'waistband',
        'neckline',
        'collar',
        'zipper'
      ];
      const restraintTerms = [
        'integrated architectural lighting',
        'one small side display',
        'one small point-like',
        'visible text',
        'kept outside the visual focus'
      ];
      const firstMeaningfulText = compactLower.trim().slice(0, 160);
      const startsWithRuleStack = /^(do not|avoid|not |negative|visible text|scene design follows the product)/i.test(firstMeaningfulText);
      const spaceIndex = findFirst(spaceTerms);
      const productIndex = findFirst(productSceneTerms);
      const hostIndex = findFirst(hostDisplayTerms);
      const restraintIndex = findFirst(restraintTerms);
      const positiveStructureOrderPass =
        !startsWithRuleStack &&
        spaceIndex >= 0 &&
        productIndex >= 0 &&
        hostIndex >= 0 &&
        restraintIndex >= 0 &&
        spaceIndex <= productIndex &&
        productIndex <= hostIndex;

      const categoryLower = productCategory.toLowerCase();
      const productDrivenScenePass = (() => {
        if (/牛仔裤|denim|jeans/i.test(productCategory)) {
          return hasAny(['deep wood','warm gray','urban commuting','denim','jeans']) && hasAny(['product mood','scene design follows the product']);
        }
        if (/连衣裙|dress/i.test(productCategory)) {
          return hasAny(['dress scenes','dress','livestream seller','product explanation gesture']) && hasAny(['not as a fashion portrait model','not a studio portrait','commercial mood','live-selling','livestream']);
        }
        if (/防晒|sun-protection/i.test(productCategory)) {

        }

      })();

      const coreSpaceChecks = [
        ['large indoor room-box', ['large indoor room-box','large room-box']],
        ['L-shaped corner composition', ['l-shaped corner composition']],
        ['visible side wall', ['visible side wall','real visible side wall','real side wall']],

        ['clean midground presentation zone', ['clean midground presentation zone','clean midground selling zone']]
      ];
      const missingSpace = coreSpaceChecks
        .filter(([, terms]) => !hasAny(terms))
        .map(([label]) => label);
      const spaceSkeletonPass = missingSpace.length === 0;

      const displayChecks = (() => {
        if (/牛仔裤|denim|jeans/i.test(productCategory)) {
          return [
            ['waistband', ['waistband']],
            ['fly front', ['fly front']],
            ['pockets', ['pockets']],
            ['leg silhouette', ['leg silhouette']],
            ['hems', ['hems','hem drape']],
            ['shoes', ['shoes']]

        }
        if (/连衣裙|dress/i.test(productCategory)) {
          return [
            ['neckline', ['neckline']],
            ['waistline', ['waistline']],
            ['sleeve', ['sleeve','sleeve shape']],

          ['garment visible', ['garment fully visible','full-body clothing display','clear garment structure']]
        ];
      })();
      const missingProductDisplay = displayChecks
        .filter(([, terms]) => !hasAny(terms))
        .map(([label]) => label);
      const productDisplayPass = missingProductDisplay.length === 0;

      const forbiddenPositivePatterns = [
        ['price', /\bprice\b/i],
        ['discount', /\bdiscount\b|折扣|满减/i],
        ['coupon', /\bcoupon\b|优惠券/i],
        ['RMB', /\brmb\b|人民币/i],
        ['promotion board', /promotion board/i],
        ['blackboard sign', /blackboard sign/i],

      const forbiddenPositiveTerms = forbiddenPositivePatterns
        .filter(([, pattern]) => pattern.test(positiveAll))
        .map(([label]) => label);
      const noLiteralBoardOrEquipmentInPositive = forbiddenPositiveTerms.length === 0;
      const noOverStackedRules = wordCount <= 300;

      const duplicatedConcepts = [
        ['live-selling room', /live-selling room|live-commerce room|livestream selling room/gi],
        ['no filming equipment', /no visible filming equipment|filming equipment|production gear|equipment setup/gi],
        ['no full row rack', /no full row|full row of clothes rack|dense retail rack/gi],
        ['large room-box', /large indoor room-box|large room-box|room box/gi],
        ['L-shaped composition', /l-shaped corner composition|l-shaped composition|corner composition/gi]
      ]
        .map(([label, pattern]) => ({label, count:conceptCount(pattern)}))
        .filter(item => item.count > 2);

      const missingCoreVisualElements = [...missingSpace, ...missingProductDisplay];
      const recommendations = [];
      if (!positiveStructureOrderPass) recommendations.push('Start compactImagePrompt with the visual space skeleton, then product-scene fit, then host/product display, then restrained risk controls.');
      if (!productDrivenScenePass) recommendations.push('Explain why the selected room style supports this product category, season, material and value tier.');
      if (!spaceSkeletonPass) recommendations.push('Restore the large room-box, L-shaped corner, visible side wall, floor depth and clean midground presentation zone.');
      if (!productDisplayPass) recommendations.push('Add the category-specific garment display points without adding props or boards.');
      if (!noLiteralBoardOrEquipmentInPositive) recommendations.push('Move literal board, price, rack and filming-equipment terms out of positive prompt; keep them only as negative risks when needed.');
      if (!noOverStackedRules) recommendations.push('prompt too long, likely rule-stacked rather than visual-directed.');
      if (duplicatedConcepts.length) recommendations.push('Reduce repeated concepts so each high-level visual idea appears once.');

      const status = [
        positiveStructureOrderPass,
        productDrivenScenePass,
        spaceSkeletonPass,
        productDisplayPass,
        noLiteralBoardOrEquipmentInPositive,
        noOverStackedRules,
        duplicatedConcepts.length === 0
      ].every(Boolean) ? 'pass' : 'fail';

      return {
        promptWritingFrameworkAudit:{
          status,
          positiveStructureOrderPass,
          productDrivenScenePass,
          spaceSkeletonPass,
          productDisplayPass,
          noLiteralBoardOrEquipmentInPositive,
          noOverStackedRules,
          wordCount,
          forbiddenPositiveTerms,
          missingCoreVisualElements,
          duplicatedConcepts,
          recommendations

          selectedLayoutVariant,
          negativePromptChecked:Boolean(negativePrompt)

    async function copyText(text){
      let helper = document.querySelector('#copyBuffer');
      if (!helper) {
        helper = document.createElement('textarea');
        helper.id = 'copyBuffer';
        helper.className = 'copy-buffer';
        helper.setAttribute('readonly','true');
        document.querySelector('.output-panel').insertBefore(helper, outputSections);
      }
      helper.value = text;
      helper.style.display = 'block';
      helper.focus();
      helper.select();
      helper.setSelectionRange(0, helper.value.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      if (ok) { helper.style.display = 'none'; return 'copied'; }
      if (navigator.clipboard?.writeText) {
        try { await navigator.clipboard.writeText(text); helper.style.display = 'none'; return 'copied'; }
        catch { helper.focus(); helper.select(); return 'manual'; }
      }
      return 'manual';
    }
