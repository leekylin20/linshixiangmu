<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>临时项目技能目录</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f8;
      --panel: #ffffff;
      --text: #1b1f24;
      --muted: #69717c;
      --line: #dce1e6;
      --line-strong: #c8d0d8;
      --accent: #2f6f73;
      --accent-2: #9b5d2f;
      --accent-3: #5f6f2f;
      --accent-4: #6c557b;
      --danger: #a34d4d;
      --shadow: 0 1px 2px rgba(20, 30, 40, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
    }

    .shell {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 40px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(86px, 1fr));
      gap: 8px;
      min-width: 310px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
    }

    .stat b {
      display: block;
      font-size: 22px;
      line-height: 1.1;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      margin: 18px 0;
      align-items: center;
    }

    .search {
      height: 42px;
      width: 100%;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 111, 115, 0.16);
    }

    .source-switch {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip,
    .filter {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      min-height: 36px;
    }

    .chip.active,
    .filter.active {
      background: #1f2a33;
      color: #fff;
      border-color: #1f2a33;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .category {
      margin: 18px 0;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .category-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }

    .category-title {
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .mark {
      width: 12px;
      height: 24px;
      border-radius: 4px;
      background: var(--accent);
      flex: 0 0 auto;
    }

    .category h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .category-count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .skill-list {
      display: grid;
    }

    .skill {
      display: grid;
      grid-template-columns: minmax(220px, 0.9fr) minmax(320px, 1.25fr) minmax(260px, 0.9fr);
      gap: 14px;
      padding: 14px 16px;
      border-top: 1px solid var(--line);
      align-items: start;
    }

    .skill:first-child { border-top: none; }

    .skill:hover { background: #fbfcfd; }

    .skill h3 {
      margin: 0 0 7px;
      font-size: 16px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .call {
      display: inline-flex;
      max-width: 100%;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 6px;
      background: #eef2f4;
      color: #26323d;
      overflow-wrap: anywhere;
    }

    .desc {
      margin: 0;
      color: #39434d;
      font-size: 13px;
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
    }

    .path {
      font-family: Consolas, "SFMono-Regular", monospace;
      background: #f1f4f6;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 8px;
      color: #31404e;
      overflow-wrap: anywhere;
    }

    .copy {
      width: fit-content;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: #23313d;
      border-radius: 7px;
      padding: 6px 9px;
      font-size: 12px;
      cursor: pointer;
    }

    .copy:active { transform: translateY(1px); }

    .empty {
      display: none;
      padding: 36px 16px;
      text-align: center;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      color: var(--muted);
      background: #fff;
    }

    .project-section {
      margin: 18px 0;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .project-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }

    .project-head h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .project-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .project-count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .project-list {
      display: grid;
    }

    .project-item {
      display: grid;
      grid-template-columns: minmax(220px, 0.95fr) minmax(280px, 1.15fr) minmax(250px, 0.9fr);
      gap: 14px;
      padding: 14px 16px;
      border-top: 1px solid var(--line);
      align-items: start;
    }

    .project-item:first-child {
      border-top: none;
    }

    .project-item:hover {
      background: #fbfcfd;
    }

    .project-item h3 {
      margin: 0 0 7px;
      font-size: 16px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .project-note {
      margin: 0;
      color: #39434d;
      font-size: 13px;
    }

    .project-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
    }

    .project-status {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef2f4;
      color: #26323d;
      font-size: 12px;
      line-height: 1.4;
    }

    .project-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .project-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: #23313d;
      border-radius: 7px;
      padding: 0 9px;
      font-size: 12px;
      text-decoration: none;
    }

    .project-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .visual .mark { background: var(--accent); }
    .content .mark { background: var(--accent-2); }
    .audio .mark { background: #5b6f8f; }
    .knowledge .mark { background: var(--accent-3); }
    .conversation .mark { background: var(--accent-4); }
    .trading .mark { background: var(--danger); }
    .system .mark { background: #4b6473; }

    @media (max-width: 880px) {
      header,
      .toolbar,
      .skill,
      .project-item {
        grid-template-columns: 1fr;
      }

      .stats {
        min-width: 0;
      }

      .project-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .source-switch {
        justify-content: flex-start;
      }
    }
  </style>
</head>

    const categoryOrder = [
      "全部",
      "视觉与生图",
      "卡片与短视频",
      "语音音频与转写",
      "笔记采集与知识库",
      "沟通与文案",
      "加密与量化",
      "系统与开发"
    ];
    const sourceOrder = ["全部来源", "E 盘技能", ".agents", "系统内置"];
    let activeCategory = "全部";
    let activeSource = "全部来源";
    const searchInput = document.getElementById("searchInput");
    const catalog = document.getElementById("catalog");
    const filters = document.getElementById("filters");
    const sourceSwitch = document.getElementById("sourceSwitch");
    const emptyState = document.getElementById("emptyState");

    function normalize(text) {
      return String(text).toLowerCase();
    }

    function matches(skill) {
      const query = normalize(searchInput.value.trim());
      const haystack = normalize([skill.name, skill.call, skill.category, skill.source, skill.path, skill.desc].join(" "));
      const categoryOk = activeCategory === "全部" || skill.category === activeCategory;
      const sourceOk = activeSource === "全部来源" || skill.source === activeSource;
      const queryOk = !query || haystack.includes(query);
      return categoryOk && sourceOk && queryOk;
    }

    function createButton(label, active, onClick, className) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `${className} ${active ? "active" : ""}`;
      button.textContent = label;
      button.addEventListener("click", onClick);
      return button;
    }

    function renderControls() {
      filters.innerHTML = "";
      categoryOrder.forEach(category => {
        const count = category === "全部" ? skills.length : skills.filter(skill => skill.category === category).length;
        filters.appendChild(createButton(`${category} ${count}`, activeCategory === category, () => {
          activeCategory = category;
          render();
        }, "filter"));
      });

      sourceSwitch.innerHTML = "";
      sourceOrder.forEach(source => {
        const count = source === "全部来源" ? skills.length : skills.filter(skill => skill.source === source).length;
        sourceSwitch.appendChild(createButton(`${source} ${count}`, activeSource === source, () => {
          activeSource = source;
          render();
        }, "chip"));
      });
    }

    function renderSkill(skill) {
      const article = document.createElement("article");
      article.className = "skill";
      article.dataset.category = skill.category;
      article.dataset.source = skill.source;
      article.innerHTML = `
        <div>
          <h3>${escapeHtml(skill.name)}</h3>
          <span class="call">${escapeHtml(skill.call)}</span>
        </div>
        <p class="desc">${escapeHtml(skill.desc)}</p>
        <div class="meta">
          <div>${escapeHtml(skill.source)} · ${escapeHtml(skill.category)}</div>
          <div class="path">${escapeHtml(skill.path)}</div>
          <button class="copy" type="button" data-copy="${escapeAttr(skill.path)}">复制路径</button>
        </div>
      `;
      return article;
    }

    function render() {
      renderControls();
      const visible = skills.filter(matches);
      const byCategory = new Map();
      visible.forEach(skill => {
        if (!byCategory.has(skill.category)) byCategory.set(skill.category, []);
        byCategory.get(skill.category).push(skill);
      });

      catalog.innerHTML = "";
      categoryOrder.slice(1).forEach(category => {
        const categorySkills = byCategory.get(category);
        if (!categorySkills || categorySkills.length === 0) return;
        const section = document.createElement("section");
        const group = categorySkills[0].group;
        section.className = `category ${group}`;
        section.innerHTML = `
          <div class="category-head">
            <div class="category-title">
              <span class="mark" aria-hidden="true"></span>
              <h2>${escapeHtml(category)}</h2>
            </div>
            <span class="category-count">${categorySkills.length} 个技能</span>
          </div>
          <div class="skill-list"></div>
        `;
        const list = section.querySelector(".skill-list");
        categorySkills.forEach(skill => list.appendChild(renderSkill(skill)));
        catalog.appendChild(section);
      });

      document.getElementById("totalCount").textContent = skills.length;
      document.getElementById("shownCount").textContent = visible.length;
      document.getElementById("categoryCount").textContent = new Set(skills.map(skill => skill.category)).size;
      emptyState.style.display = visible.length ? "none" : "block";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    document.addEventListener("click", async event => {
      const button = event.target.closest("[data-copy]");
      if (!button) return;
      try {
        await navigator.clipboard.writeText(button.dataset.copy);
        const oldText = button.textContent;
        button.textContent = "已复制";
        setTimeout(() => button.textContent = oldText, 1000);
      } catch {
        button.textContent = "复制失败";
        setTimeout(() => button.textContent = "复制路径", 1000);
      }
    });

    searchInput.addEventListener("input", render);
    render();

    const projects = [
      {
        name: "Muse-UI",
        repo: "https://github.com/museui/muse-ui",
        path: "E:\\临时项目\\muse-ui",
        status: "已克隆并完成本地依赖安装",
        stack: "Vue 2 · Material Design · 旧版组件库",
        note: "经典 Muse-UI 仓库，README 标注不再维护。适合做 Vue2 组件参考、样式复用和本地实验。"
      },
      {
        name: "muse-ui-fabric",
        repo: "https://github.com/zhouxianjun/muse-ui-fabric",
        path: "E:\\临时项目\\muse-ui-fabric",
        status: "画布工作台已安装并启动",
        stack: "Vue 2 · Muse-UI 3 · Fabric.js",
        note: "真正的 Muse UI 画布/海报编辑工作台；本地入口 http://127.0.0.1:8092/，启动脚本 run_workbench.ps1。"
      }
    ];

    const projectCatalog = document.getElementById("projectCatalog");
    const projectCount = document.getElementById("projectCount");

    function renderProjects() {
      if (!projectCatalog) return;
      projectCatalog.innerHTML = "";
      projects.forEach(project => {
        const article = document.createElement("article");
        article.className = "project-item";
        article.innerHTML = `
          <div>
            <h3>${escapeHtml(project.name)}</h3>
            <div class="project-status">${escapeHtml(project.status)}</div>
          </div>
          <p class="project-note">${escapeHtml(project.note)}</p>
          <div class="project-meta">
            <div class="path">${escapeHtml(project.path)}</div>
            <div class="project-links">
              <a class="project-link" href="${escapeAttr(project.repo)}" target="_blank" rel="noreferrer">GitHub</a>
              <button class="copy" type="button" data-copy="${escapeAttr(project.path)}">复制路径</button>
            </div>
            <div>${escapeHtml(project.stack)}</div>
          </div>
        `;
        projectCatalog.appendChild(article);
      });
      if (projectCount) {
        projectCount.textContent = `${projects.length} 个项目`;
      }
    }

    renderProjects();
  </script>
