# Batch watermark config
# Put images into the input folder, then double-click 一键加水印.bat.

WatermarkText=图明索高清调试
InputPath=input
OutputPath=output
CreateTimestampFolder=true

# Position: middle-sides, br, bl, tr, tl, center, tile, diamond
Position=middle-sides

# 1-100. 80 means very visible.
Opacity=80

# FontSize: small4, small5, 12pt, 16px, or a percent number like 5.
FontSize=small4

# Rotation angle for text marks.
Angle=-35

# true/false. true scans subfolders too.
Recursive=false

# 1-100 for JPG/JPEG output.
JpegQuality=92
