<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图明索直播间搭建信息金句 01</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article class="card card-01">
    <div class="chrome">
      <div class="brand"><strong>图明索</strong><span>直播间搭建信息金句</span></div>
      <div class="page">01</div>
    </div>

    <main class="frame layout-cover">
      <section class="copy copy-cover">
        <div class="stack">
          <div class="kicker">cover / 用户先看到什么</div>
          <h1 class="headline">用户不是看设备。用户只看清不清楚、累不累。</h1>
          <p class="lede">直播间搭建的目的，是让人愿意停留，而不是把参数堆满。</p>
        </div>
        <div class="tag-row">
          <span class="tag">用户视角</span>
          <span class="tag">图明索</span>
          <span class="tag">3:4</span>
        </div>
      </section>

      <figure class="scene scene-cover" aria-label="直播间搭建占位场景">
        <div class="slot-label">PHOTO SLOT</div>
        <div class="monitor"></div>
        <div class="camera"></div>
        <div class="tripod"></div>
        <div class="lamp"></div>
        <div class="lamp lamp-b"></div>
        <div class="cable cable-a"></div>
        <div class="cable cable-b"></div>
        <figcaption class="scene-caption">先解决观看感，再谈设备</figcaption>
      </figure>
    </main>

    <footer class="foot">
      <span>用户视角</span>
      <span>图明索</span>
      <span>直播间搭建判断</span>
    </footer>
  </article>
</body>
</html>
