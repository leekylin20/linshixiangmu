<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图明索直播间搭建信息金句 05</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article class="card card-05">
    <div class="chrome">
      <div class="brand"><strong>图明索</strong><span>直播间搭建信息金句</span></div>
      <div class="page">05</div>
    </div>

    <main class="frame layout-meter">
      <section class="meter">
        <div class="stack">
          <div class="kicker">04 / 用户痛点</div>
          <h1 class="headline small">用户说“糊一下又清楚”，通常不是手机问题。</h1>
          <p class="lede tight">他们看到的是卡、糊、马赛克。后台要先看网络有没有被塞满。</p>
        </div>

        <p class="big-figure">80%</p>
        <p class="formula">实际上传速度 × 0.8</p>

        <div class="bar">
          <div class="bar-track"><div class="bar-fill"></div></div>
          <div class="bar-ends"><span>0%</span><span>80%</span><span>100%</span></div>
        </div>

        <div class="bullet-list">
          <div class="bullet"><strong>01</strong><span>先问观众：是一直糊，还是一阵一阵糊。</span></div>
          <div class="bullet"><strong>02</strong><span>一阵一阵糊，多半是上行波动或码率顶满。</span></div>
          <div class="bullet"><strong>03</strong><span>先稳住不断流，再往高清晰度上推。</span></div>
        </div>
      </section>

      <figure class="scene scene-bitrate" aria-label="码率余量占位场景">
        <div class="slot-label">PHOTO SLOT</div>
        <div class="bandwidth"></div>
        <div class="band-lines">
          <div class="band-line fill"></div>
          <div class="band-line fill small"></div>
          <div class="band-line tiny"></div>
          <div class="band-line small"></div>
        </div>
        <div class="band-pill">80%</div>
        <div class="band-badge">UPLOAD HEADROOM</div>
        <figcaption class="scene-caption">用户看到卡顿，后台看余量</figcaption>
      </figure>
    </main>

    <footer class="foot">
      <span>卡顿变糊</span>
      <span>图明索</span>
      <span>先稳住</span>
    </footer>
  </article>
</body>
</html>
