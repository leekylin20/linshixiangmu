<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图明索直播间搭建信息金句 06</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article class="card card-06">
    <div class="chrome">
      <div class="brand"><strong>图明索</strong><span>直播间搭建信息金句</span></div>
      <div class="page">06</div>
    </div>

    <main class="frame layout-closer">
      <section class="copy copy-tight">
        <div class="stack">
          <div class="kicker">05 / 用户痛点</div>
          <h1 class="headline small">用户听着累，往往比画面不清更先离开。</h1>
          <p class="lede tight">刺耳、忽大忽小、环境噪声多，用户不会分析原因，只会直接划走。</p>
        </div>

        <div class="audio-rail">
          听感 <span class="sep">—</span> 音量 <span class="sep">—</span> 噪声 <span class="sep">—</span> 路径
        </div>

        <div class="bullet-list">
          <div class="bullet"><strong>01</strong><span>先听一句完整话：有没有刺、闷、忽大忽小。</span></div>
          <div class="bullet"><strong>02</strong><span>再查麦克风距离、环境声、调音台和软件输入。</span></div>
          <div class="bullet"><strong>03</strong><span>声音舒服了，用户才愿意继续听你介绍。</span></div>
        </div>
      </section>

      <figure class="scene scene-audio" aria-label="音频链路占位场景">
        <div class="slot-label">PHOTO SLOT</div>
        <div class="wave"></div>
        <div class="mic"></div>
        <div class="mixer"></div>
        <div class="audio-tag">LISTEN FIRST</div>
        <figcaption class="scene-caption">先听用户会不会累</figcaption>
      </figure>
    </main>

    <footer class="foot">
      <span>听着累</span>
      <span>图明索</span>
      <span>声音先舒服</span>
    </footer>
  </article>
</body>
</html>
