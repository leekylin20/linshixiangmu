<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图明索直播间搭建信息金句 02</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article class="card card-02">
    <div class="chrome">
      <div class="brand"><strong>图明索</strong><span>直播间搭建信息金句</span></div>
      <div class="page">02</div>
    </div>

    <main class="frame layout-split">
      <section class="copy copy-tight">
        <div class="stack">
          <div class="kicker">01 / 用户痛点</div>
          <h1 class="headline small">用户说“声音慢半拍”，先别急着调滤镜。</h1>
          <p class="lede tight">他们听到的是别扭，后台要查的是声音和画面是不是走了两条路。</p>
        </div>

        <div class="bullet-list">
          <div class="bullet"><strong>01</strong><span>先复现用户感受：嘴型、拍手、字幕是否对得上。</span></div>
          <div class="bullet"><strong>02</strong><span>再看入口：画面从哪里进，声音从哪里进。</span></div>
          <div class="bullet"><strong>03</strong><span>最后才调延迟补偿，不要上来就堆插件。</span></div>
        </div>

        <div class="rail">
          <span class="node">用户</span>
          <span class="arrow">—</span>
          <span class="node">听感</span>
          <span class="arrow">—</span>
          <span class="node">路径</span>
          <span class="arrow">—</span>
          <span class="node">修正</span>
        </div>
      </section>

      <figure class="scene scene-chain" aria-label="信号链路占位场景">
        <div class="slot-label">PHOTO SLOT</div>
        <div class="chain-rail">
          <div class="chain-node node-a">用户感受</div>
          <div class="chain-node node-b">入口检查</div>
          <div class="chain-node node-c">路径统一</div>
          <div class="chain-node node-d">延迟修正</div>
        </div>
        <div class="chain-note"><strong>先听感</strong>用户觉得别扭，就是问题。</div>
        <figcaption class="scene-caption">先查用户听到的问题</figcaption>
      </figure>
    </main>

    <footer class="foot">
      <span>音画不同步</span>
      <span>图明索</span>
      <span>用户感受优先</span>
    </footer>
  </article>
</body>
</html>
