<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图明索直播间搭建信息金句 03</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article class="card card-03">
    <div class="chrome">
      <div class="brand"><strong>图明索</strong><span>直播间搭建信息金句</span></div>
      <div class="page">03</div>
    </div>

    <main class="frame layout-board">
      <figure class="scene scene-wb" aria-label="白平衡占位场景">
        <div class="slot-label">PHOTO SLOT</div>
        <div class="wb-disc"></div>
        <div class="wb-strip strip-a"></div>
        <div class="wb-strip strip-b"></div>
        <div class="wb-strip strip-c"></div>
        <div class="wb-strip strip-d"></div>
        <div class="wb-pill pill-a">EXPOSURE LOCK</div>
        <div class="wb-pill pill-b">WB LOCK</div>
        <div class="wb-pill pill-c">THEN TONE</div>
        <figcaption class="scene-caption">用户看到的是脏色，不是参数</figcaption>
      </figure>

      <section class="board-copy">
        <div class="stack">
          <div class="kicker">02 / 用户痛点</div>
          <h1 class="headline small">用户觉得脸色怪，第一反应是“不真实”。</h1>
          <p class="lede tight">卖货直播里，颜色一漂，用户就会怀疑人、货、灯光都不靠谱。</p>
        </div>

        <div class="checklist">
          <div class="step">
            <span class="num">01</span>
            <p class="label">先看人脸</p>
            <p class="desc">脸色忽冷忽热，用户会立刻出戏。</p>
          </div>
          <div class="step">
            <span class="num">02</span>
            <p class="label">再看商品</p>
            <p class="desc">颜色不准，用户不敢下单。</p>
          </div>
          <div class="step">
            <span class="num">03</span>
            <p class="label">最后调色</p>
            <p class="desc">先稳定，再美化，顺序不能反。</p>
          </div>
        </div>
      </section>

      <div class="board-note">
        <strong>备注</strong>用户说“不像实物”，后台先查白平衡和曝光是否在漂。
      </div>
    </main>

    <footer class="foot">
      <span>颜色不准</span>
      <span>图明索</span>
      <span>先稳再美化</span>
    </footer>
  </article>
</body>
</html>
