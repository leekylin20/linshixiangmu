<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图明索直播间搭建信息金句 04</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article class="card card-04">
    <div class="chrome">
      <div class="brand"><strong>图明索</strong><span>直播间搭建信息金句</span></div>
      <div class="page">04</div>
    </div>

    <main class="frame layout-quote">
      <figure class="scene scene-light" aria-label="灯光结构占位场景">
        <div class="slot-label">PHOTO SLOT</div>
        <div class="light-field"></div>
        <div class="shadow-band"></div>
        <div class="light-ruler"></div>
        <div class="scrim-left"></div>
      </figure>

      <section class="quote-panel">
        <div class="kicker">03 / 用户痛点</div>
        <h1 class="headline">用户说“看着廉价”，很多时候是画面太平。</h1>
        <p class="lede">没有层次，脸和商品都会显脏。先把明暗拉开，再谈美颜。</p>
        <div class="callout-row">
          <div class="callout"><strong>观感</strong>用户先感到灰、脏、没有质感。</div>
          <div class="callout"><strong>排查</strong>看脸部轮廓和商品边缘有没有层次。</div>
          <div class="callout"><strong>动作</strong>先调主辅光比例，再动调色参数。</div>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span>画面廉价</span>
      <span>图明索</span>
      <span>先做层次</span>
    </footer>
  </article>
</body>
</html>
