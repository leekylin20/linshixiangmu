<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>高端大牌彩妆直播间提示词工作台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e0d0f;
      --panel: #17161a;
      --panel-2: #201f24;
      --line: #34323a;
      --text: #f5f2ef;
      --muted: #b8b0aa;
      --accent: #d8d2c8;
      --gold: #c7a56c;
      --ok: #8fe6b0;
      --bad: #ff8e8e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #1c1a1d 0, #0e0d0f 40%);
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }

    button, input, select { font: inherit; }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
    }

    aside {
      border-right: 1px solid var(--line);
      background: rgba(16, 15, 18, .92);
      padding: 20px;
      overflow: auto;
    }

    main {
      padding: 20px;
      overflow: auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.25;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .sub {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 13px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--accent);
      font-size: 12px;
    }

    select, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0b0a0c;
      color: var(--text);
      padding: 9px 10px;
      outline: none;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field { margin-bottom: 12px; }

    .actions, .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #25232a;
      color: var(--text);
      padding: 10px 12px;
      cursor: pointer;
    }

    button:hover { border-color: #5a545d; background: #2d2a32; }
    button.primary { background: #39312a; border-color: #806a42; color: #fff3d0; }

    .toolbar {
      margin-bottom: 16px;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    .status strong { color: var(--ok); }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 14px;
    }

    .card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .card-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .badge {
      border: 1px solid #41624b;
      color: var(--ok);
      background: #102018;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      white-space: nowrap;
    }

    .badge.fail {
      border-color: #7d4141;
      color: var(--bad);
      background: #291313;
    }

    pre {
      margin: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0b0a0c;
      color: #eee7df;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 260px;
      overflow: auto;
      line-height: 1.55;
      font-size: 12px;
    }

    .mini-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .audit-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .audit-item {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      padding: 6px 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .audit-item.pass { color: var(--ok); }
    .audit-item.fail { color: var(--bad); }

    @media (max-width: 920px) {
      .shell { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <h1>高端大牌彩妆直播间提示词工作台</h1>
      <p class="sub">前景成交骨架锁定版｜35mm｜空间一体化引擎。先锁摄影机、空间分层、灯光、材质、物体落点、反射、景深，再生成彩妆内容；背景只做同一机位里的后景换装。</p>

      <section class="panel">
        <h2>生成设置</h2>
        <div class="field">
          <label for="sceneTheme">scene_theme</label>
          <select id="sceneTheme"></select>
        </div>
        <div class="field">
          <label for="backgroundRoute">background_style</label>
          <select id="backgroundRoute"></select>
        </div>
        <div class="field">
          <label for="backgroundRandomMode">background_random_mode</label>
          <select id="backgroundRandomMode"></select>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="count">数量</label>
            <input id="count" type="number" min="1" max="30" value="7" />
          </div>
          <div class="field">
            <label for="title">主标题</label>
            <input id="title" placeholder="留空自动" />
          </div>
        </div>
        <div class="field">
          <label for="subtitle">副标题</label>
          <input id="subtitle" placeholder="留空自动" />
        </div>
        <div class="actions">
          <button class="primary" id="generateBtn">生成</button>
          <button id="resetBtn">重置</button>
        </div>
      </section>

      <section class="panel">
        <h2>锁定项</h2>
        <p class="sub">竖版 9:16，中国抖音坐播，35mm 正面中近景，125cm 机位，轻微下俯 2°，单一正面一点透视；人物、产品、桌台、背景、灯光、阴影、反射、景深属于同一个物理空间。</p>
      </section>
    </aside>

    <main>
      <div class="toolbar">
        <button id="copyTxtBtn">复制 TXT</button>
        <button id="copyJsonBtn">复制 JSON</button>
        <button id="downloadTxtBtn">下载 TXT</button>
        <button id="downloadJsonBtn">下载 JSON</button>
        <span class="status" id="statusText"></span>
      </div>
      <div class="cards" id="cards"></div>
    </main>
  </div>

  <script src="./workbench.js"></script>
  <script>
    const wb = window.PremiumMakeupLiveRoomWorkbench;
    const state = { batch: null };

    const els = {
      sceneTheme: document.getElementById("sceneTheme"),
      backgroundRoute: document.getElementById("backgroundRoute"),
      backgroundRandomMode: document.getElementById("backgroundRandomMode"),
      count: document.getElementById("count"),
      title: document.getElementById("title"),
      subtitle: document.getElementById("subtitle"),
      generateBtn: document.getElementById("generateBtn"),
      resetBtn: document.getElementById("resetBtn"),
      copyTxtBtn: document.getElementById("copyTxtBtn"),
      copyJsonBtn: document.getElementById("copyJsonBtn"),
      downloadTxtBtn: document.getElementById("downloadTxtBtn"),
      downloadJsonBtn: document.getElementById("downloadJsonBtn"),
      statusText: document.getElementById("statusText"),
      cards: document.getElementById("cards")
    };

    function initSelect(select, list, autoLabel) {
      select.innerHTML = "";
      const auto = document.createElement("option");
      auto.value = "auto";
      auto.textContent = autoLabel;
      select.appendChild(auto);
      list.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.label;
        select.appendChild(option);
      });
    }

    function getOptions() {
      return {
        sceneTheme: els.sceneTheme.value,
        backgroundRoute: els.backgroundRoute.value,
        backgroundRandomMode: els.backgroundRandomMode.value,
        count: Number(els.count.value || 7),
        title: els.title.value,
        subtitle: els.subtitle.value
      };
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function render() {
      const batch = state.batch;
      const passCount = batch.items.filter((item) => item.audit.status === "pass").length;
      const bgAudit = batch.backgroundDistributionAudit || {};
      els.statusText.innerHTML = `已生成 <strong>${batch.count}</strong> 条，audit pass <strong>${passCount}</strong> 条，背景 <strong>${bgAudit.uniqueBackgroundCount || 0}</strong> 种，分散 ${bgAudit.status || "n/a"}`;
      els.cards.innerHTML = "";
      batch.items.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "card";
        const auditEntries = Object.entries(item.audit)
          .filter(([, value]) => typeof value === "boolean")
          .map(([key, value]) => `<span class="audit-item ${value ? "pass" : "fail"}">${value ? "pass" : "fail"} ${key}</span>`)
          .join("");
        card.innerHTML = `
          <div class="card-head">
            <div>
              <h2>#${index + 1} ${item.mainProductCn}｜${item.backgroundRouteCn}</h2>
              <div class="meta">${item.title} / ${item.subtitle}<br>${item.backgroundRoute}<br>${item.promptId}</div>
            </div>
            <span class="badge ${item.audit.status === "pass" ? "" : "fail"}">${item.audit.status}</span>
          </div>
          <div class="mini-actions">
            <button data-action="copy-positive" data-index="${index}">正向</button>
            <button data-action="copy-negative" data-index="${index}">负向</button>
            <button data-action="copy-line" data-index="${index}">整行</button>
          </div>
          <pre>${escapeHtml(item.positivePrompt)}</pre>
          <pre>${escapeHtml(item.negativePrompt)}</pre>
          <div class="audit-list">${auditEntries}</div>
        `;
        els.cards.appendChild(card);
      });
    }

    function generate() {
      state.batch = wb.generateBatch(getOptions());
      render();
    }

    async function copyText(text) {
      await navigator.clipboard.writeText(text);
      els.statusText.innerHTML = "已复制";
    }

    function download(filename, text) {
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    els.generateBtn.addEventListener("click", generate);
    els.resetBtn.addEventListener("click", () => {
      els.sceneTheme.value = "eyeshadow_palette_special";
      els.backgroundRoute.value = "auto";
      els.backgroundRandomMode.value = "route_balanced";
      els.count.value = "7";
      els.title.value = "";
      els.subtitle.value = "";
      generate();
    });
    els.copyTxtBtn.addEventListener("click", () => copyText(wb.buildTxt(state.batch)));
    els.copyJsonBtn.addEventListener("click", () => copyText(JSON.stringify(state.batch, null, 2)));
    els.downloadTxtBtn.addEventListener("click", () => download("premium-makeup-live-room-prompts.txt", wb.buildTxt(state.batch)));
    els.downloadJsonBtn.addEventListener("click", () => download("premium-makeup-live-room-prompts.json", JSON.stringify(state.batch, null, 2)));
    els.cards.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const item = state.batch.items[Number(button.dataset.index)];
      if (button.dataset.action === "copy-positive") copyText(item.positivePrompt);
      if (button.dataset.action === "copy-negative") copyText(item.negativePrompt);
      if (button.dataset.action === "copy-line") {
        copyText(`#${Number(button.dataset.index) + 1} 【生图提示词】 ${item.positivePrompt.replace(/[\r\n]+/g, " ").replace(/\s+/g, " ").trim()} 【负面提示词】 ${item.negativePrompt.replace(/[\r\n]+/g, " ").replace(/\s+/g, " ").trim()}`);
      }
    });

    initSelect(els.sceneTheme, wb.SCENE_THEMES, "自动");
    initSelect(els.backgroundRoute, wb.BACKGROUND_ROUTES, "自动轮换");
    initSelect(els.backgroundRandomMode, wb.BACKGROUND_RANDOM_MODES, "背景路由均衡打散");
    els.sceneTheme.value = "eyeshadow_palette_special";
    els.backgroundRandomMode.value = "route_balanced";
    generate();
  </script>
</body>
</html>
